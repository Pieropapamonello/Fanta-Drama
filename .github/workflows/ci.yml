name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root deps
        run: npm ci
      - name: Lint and type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
