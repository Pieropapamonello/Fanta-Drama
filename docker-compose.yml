version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fantadrama
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fantadrama
      JWT_SECRET: change_me
      CLIENT_URL: http://localhost:5173
    depends_on:
      - db
    ports:
      - "4000:4000"

  client:
    build: ./client
    ports:
      - "5173:80"

volumes:
  db-data:
