services:
  - type: web
    name: fantadrama-web
    runtime: static
    plan: free
    branch: main
    buildCommand: npm install && npm --workspace client run build
    staticPublishPath: client/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: fantadrama-server
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm --workspace server run prisma:generate && npm --workspace server run build
    preDeployCommand: npm --workspace server run prisma:migrate
    startCommand: npm --workspace server run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fantadrama-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: UPLOAD_MAX_SIZE
        value: "5000000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: fantadrama-db
    plan: free
    region: frankfurt
    databaseName: fantadrama
    user: fantadrama
