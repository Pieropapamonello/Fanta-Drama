services:
  - type: web
    name: Fanta-Drama
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: fanta-drama.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: fanta-drama
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: fanta-drama.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
      - key: VITE_TELEGRAM_BOT_USERNAME
        value: FantaDrama1_bot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_LOGIN_CLIENT_ID
        sync: false
      - key: TELEGRAM_LOGIN_CLIENT_SECRET
        sync: false
